[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-validator"
version = "0.3.0"
description = "Validador de XML de NF-e/NFC-e que explica por que a SEFAZ rejeitaria a nota"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.0"]

[project.scripts]
nfe-validator = "nfe_validator.__main__:main"
nfe-validator-dd = "nfe_validator.ferramentas.gerador_dd:main"
nfe-validator-web = "nfe_validator.web.servidor:main"

[tool.setuptools]
# Sem descoberta automática: `tests` e a raiz do projeto não são pacotes, e
# `find` acabaria empacotando coisa errada.
packages = [
    "nfe_validator",
    "nfe_validator.nucleo",
    "nfe_validator.nucleo.regras",
    "nfe_validator.ferramentas",
    "nfe_validator.web",
]

[tool.setuptools.package-data]
# Os .xsd são PARTE DA ENTREGA, não artefato de build.
#
# A RN05 exige validar contra os arquivos oficiais da SEFAZ. Sem eles no
# pacote instalado, `validar()` não quebra — degrada em silêncio para o aviso
# XSD-INDISPONIVEL em toda nota, perdendo a validação estrutural, a RN19 e as
# descrições oficiais de campo. É uma falha plausível e invisível, então o
# glob abaixo é recursivo de propósito, para pegar qualquer versão/tipo novo
# que apareça em schemas/v{versao}/{tipo}/ sem precisar editar este arquivo.
nfe_validator = [
    "schemas/**/*.xsd",
    "schemas/**/*.md",
    "schemas/**/*.txt",
    # A UI é servida do disco pelo próprio pacote: sem estes arquivos, o
    # servidor sobe e devolve ESTATICO-AUSENTE em toda requisição.
    "web/estatico/*.html",
    "web/estatico/*.css",
    "web/estatico/*.js",
]

[tool.setuptools.exclude-package-data]
nfe_validator = ["**/__pycache__/*"]
